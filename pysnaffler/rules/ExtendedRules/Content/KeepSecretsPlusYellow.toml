# snaffleplus - plausible but noisier secrets found inside file contents.
# Triage Yellow: JWTs, bearer headers, generic secret assignments. These are
# dropped automatically at interest level 2+ (-b 2).
[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepSecretsPlusYellow"
MatchAction = "Snaffle"
Description = "JWTs, Authorization: Bearer headers, and generic secret/token/password assignments - worth a look but higher false-positive rate."
MatchLocation = "FileContentAsString"
WordListType = "Regex"
MatchLength = 0
WordList = [
"eyJ[A-Za-z0-9_\\-]{10,}\\.eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}",
"[Aa]uthorization:\\s*[Bb]earer\\s+[A-Za-z0-9._\\-]{20,}",
"(?:client_secret|api[_-]?secret|access_token|refresh_token)\\s*[:=]\\s*[\"'][^\"']{8,}[\"']"
]
Triage = "Yellow"
