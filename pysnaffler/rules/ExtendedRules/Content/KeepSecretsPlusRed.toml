# snaffleplus - high-confidence modern secrets found inside file contents.
# Triage Red: provider tokens, storage keys, inline DB/OS credentials.
[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepSecretsPlusRed"
MatchAction = "Snaffle"
Description = "Cloud/CI provider tokens, Azure storage keys, DB connection URIs, Ansible vaults, PowerShell secure strings and inline net/psexec creds."
MatchLocation = "FileContentAsString"
WordListType = "Regex"
MatchLength = 0
WordList = [
"ghp_[0-9A-Za-z]{36}",
"github_pat_[0-9A-Za-z_]{82}",
"gh[ousr]_[0-9A-Za-z]{36}",
"glpat-[0-9A-Za-z_\\-]{20}",
"AIza[0-9A-Za-z_\\-]{35}",
"sk-(?:proj-)?[0-9A-Za-z_\\-]{20,}",
"[sr]k_live_[0-9A-Za-z]{24,}",
"npm_[0-9A-Za-z]{36}",
"SG\\.[0-9A-Za-z_\\-]{22}\\.[0-9A-Za-z_\\-]{43}",
"shpat_[0-9a-f]{32}",
"xox[baprs]-[0-9A-Za-z\\-]{10,}",
"hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[0-9A-Za-z]+",
"aws_secret_access_key\\s*=\\s*[0-9A-Za-z/+]{40}",
"AccountKey=[A-Za-z0-9+/]{86}==",
"DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=",
"(?:mongodb(?:\\+srv)?|postgres(?:ql)?|mysql|rediss?|amqp|ftp)://[^\\s:@/]+:[^\\s:@/]+@",
"jdbc:[a-z0-9]+://[^\\s\"']*password=[^\\s&;\"']+",
"\\$ANSIBLE_VAULT;[0-9]\\.[0-9];AES256",
"ConvertTo-SecureString\\b.{0,80}(?:-AsPlainText|-Key)",
"net use\\s+\\S+\\s+/user:\\S+\\s+\\S+",
"psexec(?:\\.exe)?\\b.{0,120}\\s-p\\s+\\S+"
]
Triage = "Red"
