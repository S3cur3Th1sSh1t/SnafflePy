# snaffleplus - top-tier secrets found inside file contents.
# Triage Black: decryptable-to-plaintext or full cloud identity.
[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepSecretsPlusBlack"
MatchAction = "Snaffle"
Description = "GPP cpassword and GCP service-account private keys - immediately usable credentials."
MatchLocation = "FileContentAsString"
WordListType = "Regex"
MatchLength = 0
WordList = [
"cpassword\\s*=\\s*(?:&quot;|\"|')?[A-Za-z0-9+/=]{5,}",
"\"private_key\"\\s*:\\s*\"-----BEGIN (?:RSA )?PRIVATE KEY-----",
"\"type\"\\s*:\\s*\"service_account\""
]
Triage = "Black"
